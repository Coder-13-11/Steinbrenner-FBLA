<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Steinbrenner FBLA · Future Business Leaders of America</title>
  <meta name="description" content="Steinbrenner High School FBLA chapter in Lutz, Florida — compete, lead, and grow with Future Business Leaders of America." />
  <meta name="theme-color" content="#05102a" />
  <meta property="og:title" content="Steinbrenner FBLA" />
  <meta property="og:description" content="Compete, lead, and grow with the Steinbrenner High School chapter of Future Business Leaders of America." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/assets/logos/fbla-crest-512.png" />
  <meta name="twitter:card" content="summary" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/logos/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/logos/favicon-16.png" />
  <link rel="apple-touch-icon" href="/assets/logos/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    // Apply the saved hub theme before first paint to avoid a flash (hub only).
    (function () {
      try {
        var t = localStorage.getItem('fbla-hub-theme');
        var hub = /^\/memberhub(\/|$)/.test(location.pathname || '');
        var theme = hub && t === 'light' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.background = theme === 'light' ? '#eef1f6' : '#05102a';
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
